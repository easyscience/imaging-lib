<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        overflow: hidden;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          sans-serif;
        font-size: 12px;
        color: #222;
      }
      .overlay {
        position: absolute;
        z-index: 1;
      }
      .panel {
        background: rgba(255, 255, 255, 0.5);
        border: 1px solid #e2e2e2;
        box-shadow: 0 1px 6px rgba(0, 0, 0, 0.12);
      }
      #toolbar {
        top: 10px;
        right: 10px;
        max-width: 80%;
        display: flex;
        flex-wrap: wrap;
        justify-content: flex-end;
        gap: 16px;
      }
      .button-group {
        display: flex;
        gap: 4px;
      }
      button {
        width: 32px;
        height: 32px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        padding: 0;
        border: 1px solid #e2e2e2;
        background: #f5f5f6;
        color: #2a3f5f;
        cursor: pointer;
      }
      button:hover {
        background: #e9eaef;
      }
      button svg {
        width: 17px;
        height: 17px;
      }
      button.letter {
        font-size: 18px;
        font-weight: bold;
      }
      /* Show/hide buttons are grey while the things they control are hidden */
      button.toggle {
        color: #b9bdc6;
      }
      button.toggle.on {
        color: #2a3f5f;
        background: #e7ecf5;
        border-color: #c6d0e2;
      }
      #download {
        right: 10px;
        bottom: 8px;
      }
      #legend {
        top: 10px;
        left: 10px;
        padding: 8px 11px;
        line-height: 1.7;
      }
      .swatch {
        display: inline-block;
        width: 11px;
        height: 11px;
        margin-right: 7px;
        border: 1px solid rgba(0, 0, 0, 0.18);
        border-radius: 50%;
        vertical-align: middle;
      }
      #hint {
        bottom: 8px;
        left: 10px;
        padding: 5px 9px;
        font-size: 11px;
        line-height: 1.5;
      }
      #tooltip {
        display: none;
        pointer-events: none;
        padding: 3px 8px;
        background: rgba(33, 42, 62, 0.92);
        color: white;
        white-space: nowrap;
      }
      .lattice-vector-label {
        font-size: 16px;
        font-weight: bold;
      }
      .atom-label {
        font-size: 11px;
        font-weight: 600;
        text-shadow:
          0 0 3px white,
          0 0 3px white,
          0 0 3px white;
      }
    </style>
    <script type="importmap">
      {
        "imports": {
          "three": "THREE_JS_URL",
          "three/addons/controls/OrbitControls.js": "ORBIT_CONTROLS_URL",
          "three/addons/renderers/CSS2DRenderer.js": "CSS2D_RENDERER_URL"
        }
      }
    </script>
  </head>
  <body>
    <div id="legend" class="overlay panel"></div>
    <div id="toolbar" class="overlay"></div>
    <div id="download" class="overlay"></div>
    <div id="hint" class="overlay panel">
      drag = rotate<br />wheel = zoom<br />right-drag = pan
    </div>
    <div id="tooltip" class="overlay"></div>
    <script type="module">
      import * as THREE from 'three'
      import { OrbitControls } from 'three/addons/controls/OrbitControls.js'
      import {
        CSS2DObject,
        CSS2DRenderer,
      } from 'three/addons/renderers/CSS2DRenderer.js'

      const lattice = LATTICE_SCENE_JSON // This gets replaced by the plot_lattice function.

      // Button icons
      const ICONS = {
        perspective:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M9 4.5 11 19.5M15 4.5 13 19.5"/></svg>',
        orthographic:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="15" rx="1.5"/><path d="M9.5 4.5V19.5M14.5 4.5V19.5"/></svg>',
        home: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11 12 3l9 8"/><path d="M5 9.5V20h5v-6h4v6h5V9.5"/></svg>',
        atoms:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M11.8 12.2 14 10M12.9 16.1l1.8.4"/><circle cx="9" cy="15" r="4.2" fill="currentColor" stroke="none"/><circle cx="16" cy="8" r="3" fill="currentColor" stroke="none"/><circle cx="17" cy="17" r="2.6" fill="currentColor" stroke="none"/></svg>',
        labels:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="14" rx="2"/><path d="M9 15.5 12 8.5l3 7M10.1 13.2h3.8"/></svg>',
        bonds:
          '<svg viewBox="0 0 24 24"><line x1="8" y1="16" x2="16" y2="8" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="6.7" cy="17.3" r="3.1" fill="currentColor"/><circle cx="17.3" cy="6.7" r="3.1" fill="currentColor"/></svg>',
        cell: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round" stroke-linecap="round"><path d="M12 2.5 20 7v9l-8 4.5L4 16V7Z"/><path d="M4 7l8 4.5L20 7M12 11.5v9"/></svg>',
        axes: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 19V6M5 19h13M5 19l7-7"/><path d="M5 6 3.3 8.2M5 6l1.7 2.2M18 19l-2.2-1.4M18 19l-2.2 1.4"/></svg>',
        camera:
          '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1Z"/><circle cx="12" cy="13" r="3.4"/></svg>',
      }

      // Keeping the drawing buffer lets the picture be downloaded
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        preserveDrawingBuffer: true,
      })
      renderer.setPixelRatio(window.devicePixelRatio)
      renderer.setSize(window.innerWidth, window.innerHeight)
      renderer.setClearColor('white')
      document.body.appendChild(renderer.domElement)

      // Text labels are HTML elements on top of the 3D drawing, which let the mouse events through to it
      const labelRenderer = new CSS2DRenderer()
      labelRenderer.setSize(window.innerWidth, window.innerHeight)
      labelRenderer.domElement.style.position = 'absolute'
      labelRenderer.domElement.style.top = '0'
      labelRenderer.domElement.style.pointerEvents = 'none'
      document.body.appendChild(labelRenderer.domElement)

      function render() {
        renderer.render(scene, camera)
        labelRenderer.render(scene, camera)
      }

      // Each kind of thing is drawn in its own group, so it can be shown and hidden with a button
      const scene = new THREE.Scene()
      const groups = {
        atoms: new THREE.Group(),
        labels: new THREE.Group(),
        bonds: new THREE.Group(),
        cell: new THREE.Group(),
        axes: new THREE.Group(),
      }
      for (const group of Object.values(groups)) {
        scene.add(group)
      }

      // Shows or hides a group. Each object is set separately, as the label renderer ignores
      // the visibility of groups.
      function setVisible(group, visible) {
        group.traverse((object) => {
          object.visible = visible
        })
      }

      function shinyMaterial(color) {
        return new THREE.MeshPhongMaterial({
          color: color,
          shininess: 90,
          specular: 0x333333,
        })
      }

      // Cylinders and cones are created along the y-axis and centred on the origin.
      // This moves and turns such a mesh so that it goes from start to end instead.
      function placeBetween(mesh, start, end) {
        const direction = end.clone().sub(start).normalize()
        mesh.position.copy(start).add(end).multiplyScalar(0.5)
        mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction)
        return mesh
      }

      function textLabel(text, className, position) {
        const element = document.createElement('div')
        element.className = className
        element.textContent = text
        const label = new CSS2DObject(element)
        label.position.set(...position)
        return label
      }

      // Atoms, as spheres, and their labels
      const unitSphere = new THREE.SphereGeometry(1, 32, 16)
      for (const atom of lattice.atoms) {
        const sphere = new THREE.Mesh(unitSphere, shinyMaterial(atom.color))
        sphere.position.set(...atom.position)
        sphere.scale.setScalar(atom.radius)
        sphere.userData.siteName = atom.site_name // Shown when hovering over the atom
        groups.atoms.add(sphere)
        groups.labels.add(textLabel(atom.label, 'atom-label', atom.position))
      }
      setVisible(groups.labels, false)

      // Bonds, as cylinders
      for (const bond of lattice.bonds) {
        const start = new THREE.Vector3(...bond.start)
        const end = new THREE.Vector3(...bond.end)
        const length = start.distanceTo(end)
        const cylinder = new THREE.CylinderGeometry(
          bond.radius,
          bond.radius,
          length,
          16,
        )
        const mesh = new THREE.Mesh(cylinder, shinyMaterial(bond.color))
        groups.bonds.add(placeBetween(mesh, start, end))
      }

      // Unit-cell edges, as lines between pairs of points
      const edgePoints = lattice.cell_edges
        .flat()
        .map((point) => new THREE.Vector3(...point))
      const edgeGeometry = new THREE.BufferGeometry().setFromPoints(edgePoints)
      const edgeMaterial = new THREE.LineBasicMaterial({
        color: lattice.cell_edge_color,
      })
      groups.cell.add(new THREE.LineSegments(edgeGeometry, edgeMaterial))

      // Lattice vectors, as arrows made of a cylinder and a cone, with a text label beyond the tip
      for (const arrow of lattice.lattice_vectors) {
        const start = new THREE.Vector3(...arrow.start)
        const end = new THREE.Vector3(...arrow.end)
        const length = start.distanceTo(end)
        const headStart = start.clone().lerp(end, 1 - arrow.head_length / length)
        const shaftLength = length - arrow.head_length
        const shaft = new THREE.CylinderGeometry(
          arrow.shaft_radius,
          arrow.shaft_radius,
          shaftLength,
          16,
        )
        const head = new THREE.ConeGeometry(arrow.head_radius, arrow.head_length, 16)
        const material = shinyMaterial(arrow.color)
        groups.axes.add(placeBetween(new THREE.Mesh(shaft, material), start, headStart))
        groups.axes.add(placeBetween(new THREE.Mesh(head, material), headStart, end))

        const label = textLabel(
          arrow.label,
          'lattice-vector-label',
          arrow.label_position,
        )
        label.element.style.color = arrow.color
        groups.axes.add(label)
      }

      // Two cameras, which both see the whole scene: a perspective one and a parallel (orthographic) one.
      // They leave some room around the scene for the buttons, legend and mouse hint.
      const bounds = new THREE.Box3()
        .setFromObject(scene)
        .getBoundingSphere(new THREE.Sphere())
      const viewRadius = 1.2 * bounds.radius
      const aspectRatio = window.innerWidth / window.innerHeight
      const perspectiveCamera = new THREE.PerspectiveCamera(30, aspectRatio, 0.1, 1000)
      const halfVerticalAngle = THREE.MathUtils.degToRad(perspectiveCamera.fov / 2)
      const halfHorizontalAngle = Math.atan(Math.tan(halfVerticalAngle) * aspectRatio)
      const distance =
        viewRadius / Math.sin(Math.min(halfVerticalAngle, halfHorizontalAngle))
      const halfHeight = viewRadius / Math.min(aspectRatio, 1)
      const orthographicCamera = new THREE.OrthographicCamera(
        -halfHeight * aspectRatio,
        halfHeight * aspectRatio,
        halfHeight,
        -halfHeight,
        0.1,
        1000,
      )

      // The starting view, with the c-axis pointing up, the b-axis to the right and the a-axis
      // towards the viewer. It is parallel at first.
      const viewDirection = new THREE.Vector3(1.7, 1, 0.65).normalize()
      const homePosition = bounds.center
        .clone()
        .addScaledVector(viewDirection, distance)
      let camera = orthographicCamera

      // Lights: an even ambient light, plus a light that moves with the camera and shines
      // over its right shoulder, so the side of the atoms facing the viewer is always lit
      scene.add(new THREE.AmbientLight('white', 0.7))
      const light = new THREE.DirectionalLight('white', 2)
      light.position.set(1, 1, 1)

      // Mouse controls: drag to rotate, scroll to zoom and right-drag to pan.
      // The controls turn the camera about the up direction the camera has when the controls are
      // created, so new controls are created whenever the camera or its up direction changes.
      let controls = null
      function useCamera(newCamera, target) {
        scene.remove(camera)
        newCamera.add(light, light.target)
        scene.add(newCamera)
        camera = newCamera
        if (controls) {
          controls.dispose()
        }
        controls = new OrbitControls(camera, renderer.domElement)
        controls.target.copy(target)
        controls.update()
        controls.addEventListener('change', render)
        render()
      }

      function resetView() {
        camera.up.set(0, 0, 1)
        camera.position.copy(homePosition)
        camera.zoom = 1
        camera.updateProjectionMatrix()
        useCamera(camera, bounds.center)
      }

      function switchProjection() {
        const newCamera =
          camera === orthographicCamera ? perspectiveCamera : orthographicCamera
        newCamera.position.copy(camera.position)
        newCamera.up.copy(camera.up)
        useCamera(newCamera, controls.target)
      }

      // Looks along a lattice vector, from its tip towards the origin, with the c-axis pointing up
      // (or the b-axis when looking along c)
      function viewAlong(index) {
        const directions = lattice.lattice_vectors.map((arrow) =>
          new THREE.Vector3(...arrow.end).normalize(),
        )
        camera.up.copy(directions[index === 2 ? 1 : 2])
        camera.position
          .copy(controls.target)
          .addScaledVector(directions[index], distance)
        useCamera(camera, controls.target)
      }

      // Toolbar
      const toolbar = document.getElementById('toolbar')

      function addButtonGroup() {
        const group = document.createElement('div')
        group.className = 'button-group'
        toolbar.appendChild(group)
        return group
      }

      function addButton(parent, content, title, onClick) {
        const button = document.createElement('button')
        button.innerHTML = content
        button.title = title
        button.addEventListener('click', onClick)
        parent.appendChild(button)
        return button
      }

      // Buttons that change the view
      const viewButtons = addButtonGroup()
      const projectionButton = addButton(
        viewButtons,
        ICONS.orthographic,
        'Parallel (orthographic) view',
        () => {
          switchProjection()
          const isOrthographic = camera === orthographicCamera
          projectionButton.innerHTML = isOrthographic
            ? ICONS.orthographic
            : ICONS.perspective
          projectionButton.title = isOrthographic
            ? 'Parallel (orthographic) view'
            : 'Perspective view'
        },
      )
      lattice.lattice_vectors.forEach((arrow, index) => {
        const button = addButton(
          viewButtons,
          arrow.label,
          `View along ${arrow.label}`,
          () => viewAlong(index),
        )
        button.className = 'letter'
        button.style.color = arrow.color
      })
      addButton(viewButtons, ICONS.home, 'Reset view', resetView)

      // Buttons that show and hide things, except when there is nothing to show (e.g. no bonds)
      const showButtons = addButtonGroup()
      const groupTitles = {
        atoms: 'Atoms',
        labels: 'Labels',
        bonds: 'Bonds',
        cell: 'Cell',
        axes: 'Axes',
      }
      for (const [name, title] of Object.entries(groupTitles)) {
        if (groups[name].children.length === 0) {
          continue
        }
        const button = addButton(showButtons, ICONS[name], title, () => {
          setVisible(groups[name], !groups[name].visible)
          button.classList.toggle('on', groups[name].visible)
          render()
        })
        button.classList.add('toggle')
        button.classList.toggle('on', groups[name].visible)
      }

      // Download button, which saves the 3D drawing (without text labels) as a PNG picture
      addButton(
        document.getElementById('download'),
        ICONS.camera,
        'Download PNG',
        () => {
          render()
          const link = document.createElement('a')
          link.download = 'lattice.png'
          link.href = renderer.domElement.toDataURL('image/png')
          link.click()
        },
      )

      // Legend, with one coloured dot per element
      const legend = document.getElementById('legend')
      const elementColors = new Map(
        lattice.atoms.map((atom) => [atom.element, atom.color]),
      )
      for (const [element, color] of elementColors) {
        const item = document.createElement('div')
        item.innerHTML = `<span class="swatch" style="background: ${color}"></span>${element}`
        legend.appendChild(item)
      }
      legend.hidden = elementColors.size === 0

      // Tooltip with the name of the atom site, shown when hovering over an atom
      const tooltip = document.getElementById('tooltip')
      const raycaster = new THREE.Raycaster()
      renderer.domElement.addEventListener('pointermove', (event) => {
        // three.js expects the mouse position to go from -1 to 1, with y pointing up
        const mousePosition = new THREE.Vector2(
          (event.clientX / window.innerWidth) * 2 - 1,
          -(event.clientY / window.innerHeight) * 2 + 1,
        )
        raycaster.setFromCamera(mousePosition, camera)
        const hits = groups.atoms.visible
          ? raycaster.intersectObjects(groups.atoms.children)
          : []
        if (hits.length > 0) {
          tooltip.textContent = hits[0].object.userData.siteName
          tooltip.style.left = `${event.clientX + 8}px`
          tooltip.style.top = `${event.clientY + 8}px`
          tooltip.style.display = 'block'
        } else {
          tooltip.style.display = 'none'
        }
      })

      resetView()
    </script>
  </body>
</html>
